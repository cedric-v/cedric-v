# Cloudflare Pages configuration for cedricv.com.
# Sensitive values are configured as encrypted variables in the Pages dashboard.
name = "cedric-v"
pages_build_output_dir = "_site"
compatibility_date = "2025-01-24"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_URL = "https://cedricv.com"
MAILJET_SENDER_NAME = "Cédric Vonlanthen"
MAILJET_SENDER_EMAIL = "cedric@e.cedricv.com"
CONTACT_TO_EMAIL = "cedric@cedricv.com"
MAILJET_LIST_ID = "10630779"
#
# Rate-limit du formulaire de contact (optionnel mais recommandé) :
# namespace KV liée au binding CONTACT_KV — utilisée par functions/api/contact.js.
# Le même namespace est partagé avec NEWSLETTER_KV (functions/api/newsletter-subscribe.js)
# : les clés sont préfixées « contact: » et « newsletter: », sans collision possible.
[[kv_namespaces]]
binding = "CONTACT_KV"
id = "042f6587142943499c2cd0242b4043d2"

# Rate-limit de la newsletter — sans ce binding, newsletter-subscribe.js
# désactive silencieusement sa protection anti-abus.
[[kv_namespaces]]
binding = "NEWSLETTER_KV"
id = "042f6587142943499c2cd0242b4043d2"
