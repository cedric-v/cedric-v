name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_validations:
        description: 'Exécuter les validations Lighthouse et W3C'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # ── Cache node_modules (biggest win) ────────────────────────────────
      # `npm ci` DELETES node_modules, so it must be skipped on a cache hit.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-24-

      - name: Install dependencies
        run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'

      - name: Build
        run: |
          set -o pipefail
          ELEVENTY_ENV=prod npm run build 2>&1 | tee /tmp/build.log
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

      - name: Verify Functions bundling
        # Cloudflare Pages bundle les Functions avec esbuild lors du déploiement.
        # On exécute le même bundling ici pour échouer avant l'étape de deploy.
        run: |
          set -e
          found=0
          for f in $(find functions -name '*.js' -type f); do
            npx --yes esbuild "$f" --bundle --outfile=/dev/null --format=esm
            found=$((found + 1))
          done
          echo "✓ $found fichier(s) Functions bundlé(s) sans erreur"

      - name: Verify CSS
        run: |
          if [ -f _site/assets/css/styles.css ]; then
            CSS_SIZE=$(stat -c%s _site/assets/css/styles.css 2>/dev/null || stat -f%z _site/assets/css/styles.css 2>/dev/null || echo "0")
            echo "✓ styles.css ($CSS_SIZE bytes)"
            if [ "$CSS_SIZE" -lt 1000 ]; then
              echo "⚠️  styles.css très petit, contenu:"
              head -5 _site/assets/css/styles.css
            fi
          else
            echo "❌ styles.css manquant"
            exit 1
          fi

      - name: Verify critical files
        run: |
          test -f _site/index.html && echo "✓ index.html" || { echo "❌ index.html manquant"; exit 1; }
          test -f _site/newsletter/index.html && echo "✓ newsletter page" || { echo "❌ newsletter page manquante"; exit 1; }
          test -f _site/functions/api/newsletter-subscribe.js && echo "✓ newsletter subscribe function" || { echo "❌ function newsletter manquante"; exit 1; }
          test -f _site/functions/api/newsletter-confirm.js && echo "✓ newsletter confirm function" || { echo "❌ function confirmation manquante"; exit 1; }
          test -f _site/functions/api/contact.js && echo "✓ contact function" || { echo "❌ function contact manquante"; exit 1; }
          # Anti-spam : la clé publique Turnstile DOIT être injectée au build.
          # Sans elle, le widget ne s'affiche pas et le formulaire est sans protection.
          if grep -q 'turnstileSiteKey = ""' _site/assets/js/contact.js; then
            echo "❌ TURNSTILE_SITE_KEY manquant au build : ajoutez le secret GitHub TURNSTILE_SITE_KEY"
            exit 1
          fi
          echo "✓ Turnstile site key injectée dans contact.js"
          test -f _site/404.html && echo "✓ 404.html" || { echo "❌ 404.html manquant"; exit 1; }
          test -f _site/fr/index.html && echo "✓ fr/index.html" || { echo "❌ fr/index.html manquant"; exit 1; }
          test -f _site/_redirects && echo "✓ _redirects" || echo "⚠️  _redirects manquant"
          INDEX_SIZE=$(stat -c%s _site/index.html 2>/dev/null || stat -f%z _site/index.html 2>/dev/null || echo "0")
          [ "$INDEX_SIZE" -gt 100 ] && echo "✓ index.html valide ($INDEX_SIZE bytes)" || { echo "❌ index.html vide ou corrompu"; exit 1; }
          grep -q "<!DOCTYPE html\|<html" _site/index.html && echo "✓ index.html contient du HTML" || { echo "❌ index.html HTML invalide"; exit 1; }

      - name: Verify images
        run: |
          set -e
          echo "── 1. Aucune erreur de génération d'image ──"
          if grep -q "Error processing image" /tmp/build.log; then
            echo "❌ Erreurs de génération d'images détectées :"
            grep "Error processing image" /tmp/build.log | head -10
            exit 1
          fi
          echo "✓ Aucune erreur de génération d'image"

          echo "── 2. Images optimisées générées ──"
          COUNT=$(find _site/assets/img -name "*-[0-9]*w.webp" 2>/dev/null | wc -l | tr -d ' ')
          echo "✓ $COUNT images optimisées (.webp multi-largeurs)"
          if [ "$COUNT" -lt 10 ]; then
            echo "❌ Trop peu d'images optimisées (shortcode image cassée ?)"
            exit 1
          fi

          echo "── 3. <picture>/srcset présents dans les pages clés ──"
          for PAGE in _site/fr/index.html _site/digital-manager/index.html _site/en/digital-manager/index.html; do
            if [ -f "$PAGE" ]; then
              if grep -q "<picture>" "$PAGE" && grep -q "srcset=" "$PAGE"; then
                echo "✓ $PAGE : <picture>/srcset OK"
              else
                echo "❌ $PAGE : sans <picture>/srcset (shortcode image cassée ?)"
                exit 1
              fi
            else
              echo "⚠️  $PAGE absent (non bloquant)"
            fi
          done

          echo "── 4. Image spécifique de l'accueil ──"
          if [ -f _site/assets/img/schema-fluance-pro-400w.webp ]; then
            echo "✓ schema-fluance-pro-400w.webp générée"
          else
            echo "❌ Image de l'accueil (schema-fluance-pro) manquante"
            exit 1
          fi

      - name: Verify audios
        run: npm test

      - name: Upload build artifact for smoke test
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: ./_site
          retention-days: 1

      - name: Upload build artifact for validation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_validations == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: validation-artifact
          path: ./_site
          retention-days: 1

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_validations == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: validation-artifact
          path: _site

      - name: Start local server
        run: |
          cd _site
          python3 -m http.server 8080 &
          echo "Server started on port 8080"
          sleep 5
        continue-on-error: true

      - name: Run Lighthouse
        run: |
          mkdir -p validation-reports
          echo "Running Lighthouse on homepage..."
          npx lighthouse http://localhost:8080/ --output=html --output-path=validation-reports/lighthouse-home.html --chrome-flags="--headless --no-sandbox" --quiet || echo "Lighthouse failed for homepage"
          npx lighthouse http://localhost:8080/ --output=json --output-path=validation-reports/lighthouse-home.json --chrome-flags="--headless --no-sandbox" --quiet || echo "Lighthouse JSON failed for homepage"

          echo "Running Lighthouse on French homepage..."
          npx lighthouse http://localhost:8080/fr/ --output=html --output-path=validation-reports/lighthouse-fr.html --chrome-flags="--headless --no-sandbox" --quiet || echo "Lighthouse failed for FR"
          npx lighthouse http://localhost:8080/fr/ --output=json --output-path=validation-reports/lighthouse-fr.json --chrome-flags="--headless --no-sandbox" --quiet || echo "Lighthouse JSON failed for FR"

          echo "Running Lighthouse on English homepage..."
          npx lighthouse http://localhost:8080/en/ --output=html --output-path=validation-reports/lighthouse-en.html --chrome-flags="--headless --no-sandbox" --quiet || echo "Lighthouse failed for EN"
          npx lighthouse http://localhost:8080/en/ --output=json --output-path=validation-reports/lighthouse-en.json --chrome-flags="--headless --no-sandbox" --quiet || echo "Lighthouse JSON failed for EN"
        continue-on-error: true

      - name: Validate HTML with W3C
        run: |
          mkdir -p validation-reports/w3c
          cd _site
          find . -name "*.html" -type f | head -10 | while read file; do
            filename=$(basename "$file" .html)
            pathname=$(echo "$file" | sed 's|^\./||' | sed 's|/|_|g')
            echo "Validating $file..."
            curl -s "https://validator.w3.org/nu/?out=json" \
              --data-binary @"$file" \
              -H "Content-Type: text/html; charset=utf-8" \
              > "../validation-reports/w3c/${pathname}.json" || true
            curl -s "https://validator.w3.org/nu/?out=html" \
              --data-binary @"$file" \
              -H "Content-Type: text/html; charset=utf-8" \
              > "../validation-reports/w3c/${pathname}.html" || true
          done
        continue-on-error: true

      - name: Create summary
        run: |
          cat > validation-reports/summary.md << 'EOF'
          # Validation Reports Summary

          This artifact contains validation reports generated automatically during the build process.

          ## Google Lighthouse Reports

          - `lighthouse-home.html` - Full Lighthouse report for the homepage (HTML format)
          - `lighthouse-fr.html` - Full Lighthouse report for the French homepage (HTML format)
          - `lighthouse-en.html` - Full Lighthouse report for the English homepage (HTML format, if available)
          - `lighthouse-home.json` - Lighthouse data for the homepage (JSON format)
          - `lighthouse-fr.json` - Lighthouse data for the French homepage (JSON format)

          ## W3C HTML Validation Reports

          - `w3c/` directory containing validation reports for up to 10 HTML pages
            - Each page has both HTML and JSON format reports
            - Files are named based on the page path (e.g., `index.html`, `fr_index.html`, `a-propos_philosophie_index.html`)

          ## How to Use

          **Lighthouse reports:**
          - Open the HTML files in your browser for a visual, interactive report
          - Lighthouse evaluates Performance, Accessibility, Best Practices, and SEO
          - Aim for scores above 90 in each category

          **W3C Validation reports:**
          - Open the HTML reports to see detailed validation errors and warnings
          - Fix any errors (marked in red) and review warnings (marked in yellow)
          - Valid HTML ensures better browser compatibility and accessibility
          EOF

      - name: Upload validation reports
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: validation-reports/
          retention-days: 30

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: _site

      - name: Verify critical files
        run: |
          test -f _site/index.html || { echo "❌ index.html manquant"; exit 1; }
          test -f _site/404.html || { echo "❌ 404.html manquant"; exit 1; }
          test -f _site/fr/index.html || { echo "❌ fr/index.html manquant"; exit 1; }
          echo "✓ Tous les fichiers critiques existent"

      - name: Start local server
        run: |
          cd _site
          python3 -m http.server 8080 > /dev/null 2>&1 &
          echo $! > /tmp/server.pid
          sleep 3

      - name: Smoke tests
        run: |
          ERRORS=0

          test_page() {
            local url=$1
            local expected=$2
            local desc=$3
            local check=$4
            code=$(curl -s -o /tmp/response.html -w "%{http_code}" "http://localhost:8080$url" || echo "000")
            if [ "$code" = "$expected" ]; then
              echo "  ✓ $desc ($code)"
              if [ -n "$check" ] && grep -q "$check" /tmp/response.html; then
                echo "    → contenu vérifié"
              fi
            else
              echo "  ❌ $desc → $code (attendu: $expected)"
              ERRORS=$((ERRORS + 1))
            fi
          }

          test_page "/" "200" "Page d'accueil" "<!DOCTYPE html"
          test_page "/404.html" "200" "Page 404" "404"
          test_page "/fr/" "200" "Page française" "<!DOCTYPE html"
          test_page "/en/" "200" "Page anglaise" "<!DOCTYPE html"
          test_page "/page-inexistante-test" "404" "Page inexistante"

          # ── Vérification de TOUTES les images de TOUTES les pages ──
          echo "  ── Crawl de toutes les pages : extraction des images ──"
          : > /tmp/imglist.txt
          PAGE_COUNT=0
          file=""
          while IFS= read -r file; do
            PAGE_COUNT=$((PAGE_COUNT + 1))
            rel="${file#_site/}"
            if [ "$rel" = "index.html" ]; then
              url="/"
            elif [[ "$rel" == */index.html ]]; then
              url="/${rel%/index.html}/"
            else
              url="/$rel"
            fi
            curl -s "http://localhost:8080$url" > /tmp/page.html 2>/dev/null
            grep -oE 'src="[^"]*"|srcset="[^"]*"' /tmp/page.html \
              | sed -E 's/^src(set)?="//; s/"$//' \
              | tr ',' '\n' \
              | sed -E 's/^[[:space:]]*//; s/[[:space:]]+[0-9]+w$//; s/[[:space:]]*$//' \
              | grep -E '^/' \
              >> /tmp/imglist.txt || true
          done < <(find _site -name "*.html" | sort)
          echo "  ✓ $PAGE_COUNT page(s) analysée(s)"

          echo "  ── Vérification des images (dédupliquées) ──"
          sort -u /tmp/imglist.txt > /tmp/imgs_unique.txt
          total=0
          imgpath=""
          while IFS= read -r imgpath; do
            total=$((total + 1))
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$imgpath")
            if [ "$code" != "200" ]; then
              echo "    ❌ $imgpath → $code"
              ERRORS=$((ERRORS + 1))
            fi
          done < /tmp/imgs_unique.txt
          echo "  ✓ $total image(s) unique(s) vérifiée(s)"

          [ $ERRORS -eq 0 ] || { echo "❌ $ERRORS erreur(s)"; exit 1; }
          echo "✓ Tous les tests ont réussi"

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
            rm /tmp/server.pid
          fi

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, smoke-test]
    # The production Deployment record (environment + url) lives on the DEPLOY
    # job — Studio Clarté tracks it after a merge to confirm the site is live
    # (one deployment per release; the verification job below has none).
    environment:
      name: production
      url: https://cedricv.com
    steps:
      # Checkout REQUIS : Wrangler bundle les Pages Functions depuis
      # process.cwd()/functions (pas depuis le dossier statique déployé).
      # Sans checkout, les fonctions /api/contact et /api/newsletter-* sont
      # silencieusement ignorées (le formulaire de contact ne fonctionne pas).
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: _site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=cedric-v

      # Worker cron qui ping /api/newsletter-remind chaque jour (relance des
      # doubles opt-in). Requiert que CLOUDFLARE_API_TOKEN ait la permission
      # Workers Scripts:Edit en plus de Cloudflare Pages:Edit.
      - name: Deploy newsletter reminder cron Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker/newsletter-remind
          command: deploy

  post-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    steps:
      - name: Wait for Cloudflare propagation
        run: |
          echo "Attente de 30s pour propagation Cloudflare..."
          sleep 30

      - name: Verify production site
        run: |
          ERRORS=0
          DEPLOY_URL="https://cedricv.com"

          test_page() {
            local url=$1
            local expected=$2
            local desc=$3
            local check=$4
            full_url="${DEPLOY_URL}${url}"
            code=$(curl -s -o /tmp/prod_response.html -w "%{http_code}" -L --max-time 15 "$full_url" || echo "000")
            if [ "$code" = "$expected" ]; then
              echo "  ✓ $desc ($code)"
              if [ -n "$check" ] && grep -q "$check" /tmp/prod_response.html; then
                echo "    → contenu vérifié"
              fi
            else
              echo "  ❌ $desc → $code (attendu: $expected)"
              head -10 /tmp/prod_response.html
              ERRORS=$((ERRORS + 1))
            fi
          }

          echo "1. Page d'accueil"
          test_page "/" "200" "Accueil" "<!DOCTYPE html"

          echo "2. Page française"
          test_page "/fr/" "200" "Français" "<!DOCTYPE html"

          echo "3. Page anglaise"
          test_page "/en/" "200" "English" "<!DOCTYPE html"

          echo "4. Page 404"
          test_page "/404.html" "200" "404" "Perte de fluance"

          echo "5. Page inexistante"
          test_page "/page-inexistante-$(date +%s)" "404" "Inexistante"

          echo "6. Fonction anti-spam du formulaire de contact déployée"
          # Fonction présente => réponse JSON (405 method_not_allowed / 400 / 503),
          # jamais la page 404 HTML ou un 405 vide des assets statiques.
          code=$(curl -s -o /tmp/api_contact.json -w "%{http_code}" --max-time 15 -X POST "$DEPLOY_URL/api/contact" -H 'Content-Type: application/json' --data '{"name":"Test","email":"test@example.com","message":"test"}')
          if grep -q '"success":' /tmp/api_contact.json 2>/dev/null && [ "$code" != "404" ]; then
            echo "  ✓ fonction /api/contact présente (HTTP $code, JSON)"
          else
            echo "  ❌ fonction /api/contact absente (HTTP $code, corps non-JSON)"
            ERRORS=$((ERRORS + 1))
          fi

          echo "7. Fonctions newsletter déployées"
          # GET sur /api/newsletter-subscribe => 405 JSON (method_not_allowed).
          code=$(curl -s -o /tmp/api_sub.json -w "%{http_code}" --max-time 15 "$DEPLOY_URL/api/newsletter-subscribe")
          if [ "$code" = "405" ] && grep -q '"error":"method_not_allowed"' /tmp/api_sub.json 2>/dev/null; then
            echo "  ✓ fonction /api/newsletter-subscribe présente (405 JSON)"
          else
            echo "  ❌ fonction /api/newsletter-subscribe absente ou muette (HTTP $code)"
            ERRORS=$((ERRORS + 1))
          fi
          # /api/newsletter-remind sans clé => 403 JSON : fonction déployée
          # ET authentification active (un 200 exposerait la relance au public).
          code=$(curl -s -o /tmp/api_remind.json -w "%{http_code}" --max-time 15 "$DEPLOY_URL/api/newsletter-remind")
          if [ "$code" = "403" ] && grep -q '"error":"unauthorized"' /tmp/api_remind.json 2>/dev/null; then
            echo "  ✓ endpoint /api/newsletter-remind présent et protégé (403)"
          else
            echo "  ❌ /api/newsletter-remind absent ou mal protégé (HTTP $code)"
            ERRORS=$((ERRORS + 1))
          fi

          if [ $ERRORS -eq 0 ]; then
            echo "✓ Production OK"
          else
            echo "❌ $ERRORS erreur(s)"
            exit 1
          fi
